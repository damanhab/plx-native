name: fork build (debug ipk)

# Builds the debug flavour (com.beb.plxnative.debug) for the fork owner's own TV.
# No telemetry credentials are passed, so telemetry is compiled out.

on:
  workflow_dispatch:
  push:
    branches: [tv-tweaks]

concurrency:
  group: fork-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'damanhab/plx-native'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the pinned Rust and the armv7 target
        uses: ./.github/actions/rust-toolchain

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: rust-modules
          key: armv7-fork

      - name: Cache the pinned downloads
        uses: ./.github/actions/deps-cache

      - id: ndk
        uses: ./.github/actions/webos-ndk

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            vendor/ffmpeg-prefix
            vendor/ffmpeg-build
          key: ffmpeg-${{ runner.arch }}-${{ hashFiles('ci/build-ffmpeg.sh', 'ci/deps.py', 'ci/dependencies.json') }}

      - name: Build + package
        env:
          WEBOS_SDK: ${{ steps.ndk.outputs.sdk-dir }}
          FLAVOR: debug
        run: |
          make -j"$(nproc)"
          make ipk
          ls -la pkg/*.ipk

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plxnative-debug-ipk
          path: pkg/*.ipk
          if-no-files-found: error
          retention-days: 14
